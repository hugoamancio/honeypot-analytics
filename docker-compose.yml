services:
  db:
    image: postgres:16-alpine
    container_name: honeypot_db
    environment:
      POSTGRES_DB: honeypot
      POSTGRES_USER: analista
      POSTGRES_PASSWORD: trocar_em_producao
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Tudo em docker-entrypoint-initdb.d roda em ordem alfabetica no
      # primeiro start. Por isso os arquivos sao numerados 01..04.
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analista -d honeypot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
